<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Conheça a Clínica Vida: um espaço para ouvir, acolher e cuidar, com diferentes especialidades e agendamento organizado. Projeto educacional do IFSC."
    />
    <meta name="theme-color" content="#166553" />
    <title>Clínica Vida • Cuidado que acolhe</title>
    <script>
      try {
        const p = localStorage.getItem("clinica_vida_tema") || "sistema";
        document.documentElement.dataset.theme =
          p === "sistema"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "escuro"
              : "claro"
            : p;
      } catch (_) {}
    </script>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/grupos/grupo-01-sprint-1.css" />
    <link rel="stylesheet" href="css/grupos/grupo-01-sprint-2.css" />
    <link rel="stylesheet" href="css/grupos/grupo-02-sprint-1.css" />
    <link rel="stylesheet" href="css/grupos/grupo-02-sprint-2.css" />
    <link rel="stylesheet" href="css/grupos/grupo-03-sprint-1.css" />
    <link rel="stylesheet" href="css/grupos/grupo-03-sprint-2.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div class="clinic-home" id="clinic-home"></div>
    <div class="app-shell" id="management-shell" hidden>
      <button
        class="sidebar-overlay"
        id="sidebar-overlay"
        aria-label="Fechar menu"
        hidden
      ></button>
      <aside class="sidebar" id="sidebar">
        <a
          class="brand"
          href="#home"
          data-action="navigate"
          data-page="home"
          aria-label="Clínica Vida, página inicial"
          ><span class="brand-mark" data-icon="cross"></span
          ><span
            ><strong
              >clínica<span class="brand-light">vida</span
              ><span class="brand-dot">.</span></strong
            ><small>GESTÃO DE CUIDADOS</small></span
          ></a
        >
        <div class="workspace-label">
          <span class="workspace-avatar">CV</span>
          <div>
            <strong>Clínica Vida</strong><small>Seu espaço de trabalho</small>
          </div>
          <span data-icon="chevrons"></span>
        </div>
        <nav id="navigation" aria-label="Navegação principal"></nav>
        <div class="sidebar-bottom">
          <div class="local-indicator">
            <span class="status-dot"></span
            ><span id="storage-label">Dados salvos neste navegador</span>
          </div>
          <p>Oficina Scrum <span>•</span> IFSC Lages</p>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            <button
              class="icon-button mobile-menu"
              id="mobile-menu"
              aria-label="Abrir menu"
              aria-controls="sidebar"
              aria-expanded="false"
              data-icon="menu"
            ></button
            ><span class="breadcrumb-root">Meu espaço</span
            ><span class="breadcrumb-slash">/</span
            ><strong id="page-title">Visão geral</strong>
          </div>
          <div class="topbar-actions">
            <span class="topbar-date" id="topbar-date"></span
            ><button
              class="icon-button"
              id="theme-toggle"
              aria-label="Alternar tema"
              title="Alternar tema"
            ></button
            ><button
              class="profile"
              data-action="navigate"
              data-page="dados"
              title="Dados e preferências"
              aria-label="Abrir dados e preferências"
            >
              CV
            </button>
          </div>
        </header>
        <div
          id="storage-warning"
          class="storage-warning"
          role="alert"
          hidden
        ></div>
        <main id="main-content" tabindex="-1"></main>
        <footer class="main-footer">
          <span>Clínica Vida <span>·</span> Um cuidado de cada vez.</span
          ><span>Projeto educacional <span>↗</span></span>
        </footer>
      </div>
    </div>
    <dialog
      id="editor-dialog"
      class="editor-dialog"
      aria-labelledby="editor-title"
    >
      <form id="record-form" novalidate>
        <div class="dialog-header">
          <div>
            <span class="eyebrow" id="editor-kicker">Cadastro</span>
            <h2 id="editor-title">Novo registro</h2>
          </div>
          <button
            class="icon-button"
            type="button"
            data-action="close-editor"
            aria-label="Fechar formulário"
            data-icon="x"
          ></button>
        </div>
        <div class="dialog-body">
          <p class="form-intro" id="form-intro"></p>
          <div id="form-error" class="alert error" role="alert" hidden></div>
          <div id="form-fields" class="form-fields"></div>
          <div id="availability-note"></div>
        </div>
        <div class="dialog-footer">
          <span class="required-note">* Campos obrigatórios</span>
          <div>
            <button
              class="button secondary"
              type="button"
              data-action="close-editor"
            >
              Cancelar</button
            ><button class="button primary" type="submit" id="save-button">
              <span data-icon="check"></span>Salvar cadastro
            </button>
          </div>
        </div>
      </form>
    </dialog>
    <dialog
      id="confirm-dialog"
      class="confirm-dialog"
      aria-labelledby="confirm-title"
    >
      <div class="confirm-icon" id="confirm-icon" data-icon="alert"></div>
      <h2 id="confirm-title">Confirmar ação</h2>
      <p id="confirm-message"></p>
      <div class="confirm-extra" id="confirm-extra"></div>
      <div class="confirm-actions">
        <button class="button secondary" id="confirm-no">Voltar</button
        ><button class="button danger" id="confirm-yes">Confirmar</button>
      </div>
    </dialog>
    <div
      id="toasts"
      class="toasts"
      aria-live="polite"
      aria-atomic="false"
    ></div>
    <input
      type="file"
      id="import-file"
      accept=".json,application/json"
      hidden
    />
    <script src="js/icons.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    <script src="js/funcionalidades/secretarias/formulario.front.js"></script>
    <script src="js/funcionalidades/secretarias/crud.back.js"></script>
    <script src="js/secretarias.js"></script>
    <script src="js/funcionalidades/salas/formulario.front.js"></script>
    <script src="js/funcionalidades/salas/crud.back.js"></script>
    <script src="js/salas.js"></script>
    <script src="js/funcionalidades/convenios/formulario.front.js"></script>
    <script src="js/funcionalidades/convenios/crud.back.js"></script>
    <script src="js/convenios.js"></script>
    <script src="js/funcionalidades/pacientes/formulario.front.js"></script>
    <script src="js/funcionalidades/pacientes/crud.back.js"></script>
    <script src="js/pacientes.js"></script>
    <script src="js/funcionalidades/medicos/formulario.front.js"></script>
    <script src="js/funcionalidades/medicos/crud.back.js"></script>
    <script src="js/medicos.js"></script>
    <script src="js/funcionalidades/especialidades/formulario.front.js"></script>
    <script src="js/funcionalidades/especialidades/crud.back.js"></script>
    <script src="js/especialidades.js"></script>
    <script src="js/funcionalidades/agendamentos/formulario.front.js"></script>
    <script src="js/funcionalidades/agendamentos/crud.back.js"></script>
    <script src="js/agendamentos.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/home.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
